<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coussin intelligent</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Coussin intelligent</h1>

  <!-- ============ BARRE D'OUTILS ============ -->
  <div class="carte barre-outils">
    <button class="principal" id="btnConnecter">Connecter le coussin</button>
    <button id="btnDemo">Mode démo</button>
    <button id="btnCalibrer" disabled>Calibrer</button>
    <span id="etat">Aucune source de données</span>
  </div>

  <div class="carte barre-outils">
    <button id="btnEnregistrer" disabled>● Enregistrer</button>
    <label class="bouton" for="fichierSession">Rejouer un fichier</label>
    <input type="file" id="fichierSession" accept=".csv" hidden>
    <label class="petit-label">Vitesse
      <select id="vitesse">
        <option value="1">×1</option>
        <option value="5">×5</option>
        <option value="20">×20</option>
      </select>
    </label>
    <span id="etatEnregistrement"></span>
  </div>

  <!-- ============ CALIBRATION (s'affiche pendant la calibration) ============ -->
  <div class="carte" id="calib">
    <div class="etape" id="calibEtape"></div>
    <div class="consigne" id="calibConsigne"></div>
    <div class="compte" id="calibCompte"></div>
    <div class="etape" id="calibRecus"></div>
    <div id="calibResultat"></div>
    <button id="btnFermerCalib" hidden>Fermer</button>
  </div>

  <div class="grille">
    <!-- ============ SILHOUETTE (vue de dos) ============ -->
    <div class="carte">
      <svg id="silhouette" viewBox="0 0 300 420" role="img" aria-label="Silhouette vue de dos, zones colorées selon la pression">
        <g class="contour">
          <circle cx="150" cy="42" r="26"/>
          <rect x="140" y="68" width="20" height="12"/>
          <rect x="74" y="88" width="18" height="128" rx="9"/>
          <rect x="208" y="88" width="18" height="128" rx="9"/>
          <rect x="96" y="80" width="108" height="168" rx="30"/>
          <rect x="104" y="374" width="36" height="40" rx="8"/>
          <rect x="160" y="374" width="36" height="40" rx="8"/>
        </g>
        <line class="colonne" x1="150" y1="96" x2="150" y2="236"/>
        <!-- Zones de capteurs : l'id « z_XXX » doit correspondre au nom de zone dans config.js -->
        <rect id="z_DOS_G" x="110" y="100" width="30" height="128" rx="10"/>
        <rect id="z_DOS_D" x="160" y="100" width="30" height="128" rx="10"/>
        <ellipse id="z_FG" cx="122" cy="276" rx="30" ry="25"/>
        <ellipse id="z_FD" cx="178" cy="276" rx="30" ry="25"/>
        <rect id="z_CG" x="96" y="306" width="50" height="64" rx="10"/>
        <rect id="z_CD" x="154" y="306" width="50" height="64" rx="10"/>
        <!-- Pourcentages affichés sur chaque zone -->
        <text id="t_DOS_G" x="125" y="164"></text>
        <text id="t_DOS_D" x="175" y="164"></text>
        <text id="t_FG" x="122" y="281"></text>
        <text id="t_FD" x="178" y="281"></text>
        <text id="t_CG" x="121" y="343"></text>
        <text id="t_CD" x="179" y="343"></text>
        <text class="cote" x="40" y="280">G</text>
        <text class="cote" x="260" y="280">D</text>
      </svg>
      <div class="legende">
        Pression <i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> forte
        · <i class="l0"></i> non branché
      </div>
    </div>

    <!-- ============ INDICATEURS ============ -->
    <div class="carte">
      <div class="indic">
        <div class="titre">Présence</div>
        <div class="grand" id="presence">--</div>
      </div>
      <div class="indic">
        <div class="titre">Immobile depuis</div>
        <div class="grand" id="immobile">--</div>
      </div>
      <div class="indic">
        <div class="titre">Équilibre gauche / droite (assise)</div>
        <div class="equilibre"><div class="centre"></div><div class="curseur" id="curseur"></div></div>
        <div class="petit"><span id="pctG">G --</span><span id="pctD">D --</span></div>
      </div>
      <div class="indic">
        <div class="titre">Dos</div>
        <div class="grand" id="dos">--</div>
      </div>
      <div class="petit"><span id="infoCalib">Pas encore calibré</span></div>
    </div>
  </div>
</main>

<!-- L'ordre compte : config, puis la logique, puis les sources de données -->
<script src="config.js"></script>
<script src="app.js"></script>
<script src="sources.js"></script>
</body>
</html>
